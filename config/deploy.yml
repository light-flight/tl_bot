service: tl_bot
image: light-flight/tl_bot

# Сервер, proxy.host и WEBHOOK_URL — в config/deploy.production.yml (не в git).
# kamal setup -d production

proxy:
  ssl: true
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: localhost:5555

env:
  secret:
    - TELEGRAM_BOT_TOKEN
    - LINEAR_API_KEY
    - LINEAR_TEAM
    - LINEAR_PROJECT
    - ASSIGNEE_MAP
    - TELEGRAM_WEBHOOK_SECRET
  clear:
    PORT: "3000"

builder:
  arch: amd64
